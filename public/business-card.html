<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carly Gage Photography - Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #E5E1DB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .card-container {
            width: 1050px;
            height: 600px;
            background: #F5F2EE;
            position: relative;
            padding: 70px 85px;
            box-shadow: 0 8px 32px rgba(61, 64, 67, 0.12);
            overflow: hidden;
        }

        /* Grain texture overlay */
        .card-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: grid;
            grid-template-columns: 1.35fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        /* Section label - matches website style */
        .section-label {
            font-size: 9px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.4;
            font-weight: 400;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #DCD7CF;
            max-width: 40px;
        }

        /* Name section - editorial style */
        .name-section {
            margin-bottom: 48px;
        }

        .name {
            font-family: 'Playfair Display', serif;
            font-size: 76px;
            font-weight: 400;
            color: #3D4043;
            letter-spacing: -1.5px;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        .name-italic {
            font-style: italic;
            opacity: 0.7;
            font-weight: 400;
        }

        .name-photography {
            font-size: 62px;
            font-weight: 300;
            opacity: 0.8;
            font-style: normal;
            letter-spacing: -0.5px;
        }

        .title {
            font-size: 11px;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: #4A5D4E;
            font-weight: 400;
            margin-top: 20px;
        }

        /* Contact section - editorial style with border-l */
        .contact-section {
            margin-top: 40px;
            padding-left: 20px;
            border-left: 1px solid #DCD7CF;
        }

        .contact-info {
            font-size: 15px;
            color: #3D4043;
            line-height: 2.6;
            letter-spacing: 0.04em;
            font-weight: 300;
        }

        .contact-item {
            margin-bottom: 8px;
            display: flex;
            align-items: baseline;
        }

        .contact-label {
            color: #3D4043;
            opacity: 0.65;
            font-weight: 400;
            min-width: 95px;
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        .contact-value {
            color: #3D4043;
            font-weight: 500;
            flex: 1;
            font-size: 15px;
            opacity: 0.9;
        }

        /* Photo section - right side */
        .photo-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
        }

        .photo-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
        }

        .photo-frame {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #DCD7CF;
            box-shadow: 
                0 4px 20px rgba(61, 64, 67, 0.1),
                0 0 0 1px rgba(61, 64, 67, 0.06);
            background: #F5F2EE;
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 20%;
        }

        /* QR Code - positioned below photo */
        .qr-code {
            width: 90px;
            height: 90px;
            background: white;
            padding: 6px;
            border-radius: 3px;
            box-shadow: 0 2px 6px rgba(61, 64, 67, 0.08);
            border: 1px solid rgba(61, 64, 67, 0.06);
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Decorative accent - subtle */
        .accent-line {
            position: absolute;
            bottom: 70px;
            left: 85px;
            width: 60px;
            height: 1px;
            background: #DCD7CF;
            z-index: 3;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .card-container {
                box-shadow: none;
                width: 3.5in;
                height: 2in;
                padding: 0.3in 0.4in;
                page-break-inside: avoid;
            }
        }

        /* Fallback for image loading */
        .photo-frame {
            background-image: url('https://carlygage.com/images/planetblue038.jpg');
            background-size: cover;
            background-position: 50% 20%;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="accent-line"></div>
        <div class="card-content">
            <div class="left-section">
                <div class="name-section">
                    <div class="name">
                        Carly <span class="name-italic">Gage</span> <span class="name-photography">Photography</span>
                    </div>
                    <div class="title">Dallas Family Photographer</div>
                </div>

                <div class="contact-section">
                    <div class="contact-info">
                        <div class="contact-item">
                            <span class="contact-label">Email</span>
                            <span class="contact-value">carlygagephotography@gmail.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Phone</span>
                            <span class="contact-value">(214) 422-8050</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Website</span>
                            <span class="contact-value">carlygage.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Location</span>
                            <span class="contact-value">Flower Mound, Texas</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="photo-section">
                <div class="photo-wrapper">
                    <div class="photo-frame">
                        <img 
                            src="https://carlygage.com/images/planetblue038.jpg" 
                            alt="Carly Gage" 
                            class="photo"
                            onerror="this.style.display='none';"
                        />
                    </div>
                </div>
                <div class="qr-code">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://carlygage.com&bgcolor=F5F2EE&color=3D4043" alt="QR Code to carlygage.com" />
                </div>
            </div>
        </div>
    </div>
</body>
</html>
