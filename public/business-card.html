<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carly Gage Photography - Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #E5E1DB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .card-container {
            width: 1050px;
            height: 600px;
            background: #F5F2EE;
            position: relative;
            padding: 70px 90px;
            box-shadow: 0 8px 32px rgba(61, 64, 67, 0.12);
            overflow: hidden;
        }

        /* Grain texture overlay */
        .card-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .header {
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(61, 64, 67, 0.1);
            padding-bottom: 32px;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 78px;
            font-weight: 400;
            color: #3D4043;
            letter-spacing: -2.5px;
            line-height: 1;
            margin-bottom: 14px;
        }

        .tagline {
            font-size: 11px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.5;
            font-weight: 300;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px 0;
        }

        .title {
            font-size: 17px;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: #4A5D4E;
            font-weight: 400;
            margin-bottom: 64px;
            position: relative;
            padding-left: 2px;
        }

        .contact-info {
            font-size: 16px;
            color: #3D4043;
            line-height: 2.4;
            letter-spacing: 0.08em;
        }

        .contact-item {
            margin-bottom: 8px;
            display: flex;
            align-items: baseline;
        }

        .contact-label {
            opacity: 0.45;
            font-weight: 300;
            min-width: 105px;
            font-size: 15px;
        }

        .contact-value {
            font-weight: 400;
            flex: 1;
        }

        .footer {
            margin-top: 20px;
            padding-top: 32px;
            border-top: 1px solid rgba(61, 64, 67, 0.12);
            font-size: 10px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.4;
        }

        /* Photo section - right side */
        .photo-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .photo-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
        }

        .photo-frame {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #DCD7CF;
            box-shadow: 
                0 8px 32px rgba(61, 64, 67, 0.12),
                0 0 0 1px rgba(61, 64, 67, 0.08),
                inset 0 0 0 8px rgba(245, 242, 238, 0.8);
            background: #F5F2EE;
            position: relative;
        }

        .photo-frame::before {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            border: 1px solid rgba(61, 64, 67, 0.08);
            z-index: 1;
            pointer-events: none;
        }

        .photo-frame::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 1px solid rgba(61, 64, 67, 0.06);
            z-index: 2;
            pointer-events: none;
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 20%;
            position: relative;
            z-index: 0;
        }

        /* Decorative elements */
        .accent-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #DCD7CF;
            border-radius: 50%;
            bottom: 60px;
            right: 90px;
            z-index: 3;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .card-container {
                box-shadow: none;
                width: 3.5in;
                height: 2in;
                padding: 0.35in 0.45in;
                page-break-inside: avoid;
            }
        }

        /* Fallback for image loading */
        .photo-frame {
            background-image: url('https://carlygage.com/images/planetblue038.jpg');
            background-size: cover;
            background-position: 50% 20%;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="accent-dot"></div>
        <div class="card-content">
            <div class="left-section">
                <div class="header">
                    <div class="logo-text">CARLY GAGE</div>
                    <div class="tagline">PHOTOGRAPHY</div>
                </div>

                <div class="main-content">
                    <div class="title">Dallas Family Photographer</div>

                    <div class="contact-info">
                        <div class="contact-item">
                            <span class="contact-label">EMAIL</span>
                            <span class="contact-value">carlygagephotography@gmail.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">PHONE</span>
                            <span class="contact-value">(555) 123-4567</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">WEBSITE</span>
                            <span class="contact-value">carlygage.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">LOCATION</span>
                            <span class="contact-value">Flower Mound, Texas</span>
                        </div>
                    </div>
                </div>

                <div class="footer">
                    Serving DFW Families
                </div>
            </div>

            <div class="photo-section">
                <div class="photo-wrapper">
                    <div class="photo-frame">
                        <img 
                            src="https://carlygage.com/images/planetblue038.jpg" 
                            alt="Carly Gage" 
                            class="photo"
                            onerror="this.style.display='none';"
                        />
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
