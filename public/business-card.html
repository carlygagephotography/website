<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carly Gage Photography - Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #E5E1DB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .card-container {
            width: 1050px;
            height: 600px;
            background: #F5F2EE;
            position: relative;
            padding: 0;
            box-shadow: 
                0 12px 48px rgba(61, 64, 67, 0.08),
                0 0 0 1px rgba(61, 64, 67, 0.04);
            overflow: hidden;
        }

        /* Grain texture overlay */
        .card-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Top border accent */
        .top-accent {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4A5D4E 0%, #DCD7CF 50%, transparent 100%);
            z-index: 2;
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            align-items: stretch;
        }

        /* Left section - Editorial layout */
        .left-section {
            padding: 75px 70px 70px 85px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(61, 64, 67, 0.08);
        }

        /* Name block - Large editorial */
        .name-block {
            margin-bottom: 0;
        }

        .name-line-1 {
            font-family: 'Playfair Display', serif;
            font-size: 94px;
            font-weight: 400;
            color: #3D4043;
            letter-spacing: -3px;
            line-height: 0.92;
            margin-bottom: 4px;
        }

        .name-italic {
            font-style: italic;
            font-weight: 300;
            opacity: 0.7;
        }

        .name-line-2 {
            font-family: 'Playfair Display', serif;
            font-size: 76px;
            font-weight: 300;
            color: #3D4043;
            letter-spacing: -2px;
            line-height: 0.95;
            margin-top: -8px;
            opacity: 0.85;
            font-style: italic;
        }

        .title-block {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(61, 64, 67, 0.1);
        }

        .title {
            font-size: 10px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #4A5D4E;
            font-weight: 400;
            margin-bottom: 8px;
        }

        /* Contact grid - sophisticated layout */
        .contact-block {
            margin-top: auto;
            padding-top: 40px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 40px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .contact-label {
            font-size: 8px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.35;
            font-weight: 300;
        }

        .contact-value {
            font-size: 14px;
            color: #3D4043;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.4;
        }

        /* Right section - Photo and QR */
        .right-section {
            padding: 70px 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 32px;
            position: relative;
        }

        /* Photo - Square with elegant frame */
        .photo-container {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .photo-frame {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #F5F2EE;
            border: 1px solid rgba(61, 64, 67, 0.08);
            box-shadow: 
                0 8px 24px rgba(61, 64, 67, 0.08),
                inset 0 0 0 12px #F5F2EE;
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 20%;
        }

        /* Decorative corner elements */
        .corner-deco {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 1px solid rgba(61, 64, 67, 0.1);
        }

        .corner-top-left {
            top: -1px;
            left: -1px;
            border-right: none;
            border-bottom: none;
        }

        .corner-bottom-right {
            bottom: -1px;
            right: -1px;
            border-left: none;
            border-top: none;
        }

        /* QR Code - Minimalist */
        .qr-code-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .qr-code-label {
            font-size: 7px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.3;
            font-weight: 300;
        }

        .qr-code {
            width: 80px;
            height: 80px;
            background: white;
            padding: 6px;
            border: 1px solid rgba(61, 64, 67, 0.06);
            box-shadow: 0 1px 4px rgba(61, 64, 67, 0.05);
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Bottom accent line */
        .bottom-accent {
            position: absolute;
            bottom: 0;
            left: 85px;
            width: 120px;
            height: 1px;
            background: #DCD7CF;
            z-index: 3;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .card-container {
                box-shadow: none;
                width: 3.5in;
                height: 2in;
                padding: 0;
                page-break-inside: avoid;
            }
            .left-section, .right-section {
                padding: 0.25in 0.3in;
            }
        }

        /* Fallback for image loading */
        .photo-frame {
            background-image: url('https://carlygage.com/images/planetblue038.jpg');
            background-size: cover;
            background-position: 50% 20%;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="top-accent"></div>
        <div class="bottom-accent"></div>
        
        <div class="card-content">
            <!-- Left Section: Editorial Typography -->
            <div class="left-section">
                <div class="name-block">
                    <div class="name-line-1">
                        Carly <span class="name-italic">Gage</span>
                    </div>
                    <div class="name-line-2">
                        Photography
                    </div>
                    
                    <div class="title-block">
                        <div class="title">Dallas Family Photographer</div>
                    </div>
                </div>

                <div class="contact-block">
                    <div class="contact-grid">
                        <div class="contact-item">
                            <span class="contact-label">Email</span>
                            <span class="contact-value">carlygagephotography@gmail.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Phone</span>
                            <span class="contact-value">(214) 422-8050</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Website</span>
                            <span class="contact-value">carlygage.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Location</span>
                            <span class="contact-value">Flower Mound, Texas</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Section: Photo & QR -->
            <div class="right-section">
                <div class="photo-container">
                    <div class="corner-deco corner-top-left"></div>
                    <div class="corner-deco corner-bottom-right"></div>
                    <div class="photo-frame">
                        <img 
                            src="https://carlygage.com/images/planetblue038.jpg" 
                            alt="Carly Gage" 
                            class="photo"
                            onerror="this.style.display='none';"
                        />
                    </div>
                </div>

                <div class="qr-code-wrapper">
                    <div class="qr-code-label">Visit Online</div>
                    <div class="qr-code">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://carlygage.com&bgcolor=F5F2EE&color=3D4043" alt="QR Code to carlygage.com" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
