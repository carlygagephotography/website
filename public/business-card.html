<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carly Gage Photography - Business Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #E5E1DB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .card-container {
            width: 1050px;
            height: 600px;
            background: #F5F2EE;
            position: relative;
            padding: 75px 85px;
            box-shadow: 0 8px 32px rgba(61, 64, 67, 0.12);
            overflow: hidden;
        }

        /* Grain texture overlay */
        .card-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .left-section {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        /* Logo - matches website design */
        .logo {
            display: flex;
            flex-direction: column;
            leading-none;
            margin-bottom: 50px;
        }

        .logo-name {
            font-family: 'Playfair Display', serif;
            font-size: 70px;
            font-weight: 400;
            color: #3D4043;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 8px;
        }

        .logo-tagline {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 6px;
        }

        .logo-tagline::before,
        .logo-tagline::after {
            content: "";
            height: 0.5px;
            flex: 1;
            background: rgba(61, 64, 67, 0.2);
            max-width: 35px;
        }

        .logo-tagline-text {
            font-size: 10px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.4;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        /* Main content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .title-section {
            margin-bottom: 45px;
        }

        .title {
            font-size: 11px;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: #4A5D4E;
            font-weight: 400;
            margin-bottom: 4px;
        }

        /* Contact grid - creative layout */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px 40px;
            margin-bottom: 50px;
        }

        .contact-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-label {
            font-size: 8px;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.35;
            font-weight: 400;
        }

        .contact-value {
            font-size: 15px;
            color: #3D4043;
            font-weight: 400;
            letter-spacing: 0.02em;
            line-height: 1.4;
        }

        /* Location note */
        .location-note {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.4;
            font-weight: 300;
            margin-top: auto;
            padding-top: 30px;
            border-top: 1px solid rgba(61, 64, 67, 0.1);
        }

        /* Right section - Photo and QR */
        .right-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            height: 100%;
        }

        .photo-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .photo-frame {
            width: 100%;
            height: 100%;
            position: relative;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #DCD7CF;
            box-shadow: 
                0 6px 24px rgba(61, 64, 67, 0.12),
                0 0 0 1px rgba(61, 64, 67, 0.08);
            background: #F5F2EE;
        }

        .photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 20%;
        }

        /* QR Code - elegant placement */
        .qr-code-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .qr-code-label {
            font-size: 7px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #3D4043;
            opacity: 0.3;
            font-weight: 300;
        }

        .qr-code {
            width: 85px;
            height: 85px;
            background: white;
            padding: 6px;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(61, 64, 67, 0.08);
            border: 1px solid rgba(61, 64, 67, 0.06);
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Decorative elements */
        .accent-line {
            position: absolute;
            top: 75px;
            right: 85px;
            width: 80px;
            height: 1px;
            background: #DCD7CF;
            z-index: 3;
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .card-container {
                box-shadow: none;
                width: 3.5in;
                height: 2in;
                padding: 0.3in 0.4in;
                page-break-inside: avoid;
            }
        }

        /* Fallback for image loading */
        .photo-frame {
            background-image: url('https://carlygage.com/images/planetblue038.jpg');
            background-size: cover;
            background-position: 50% 20%;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="accent-line"></div>
        <div class="card-content">
            <div class="left-section">
                <!-- Logo matching website -->
                <div class="logo">
                    <div class="logo-name">Carly Gage</div>
                    <div class="logo-tagline">
                        <span class="logo-tagline-text">Photography</span>
                    </div>
                </div>

                <div class="main-content">
                    <div class="title-section">
                        <div class="title">Dallas Family Photographer</div>
                    </div>

                    <!-- Creative contact grid -->
                    <div class="contact-grid">
                        <div class="contact-item">
                            <span class="contact-label">Email</span>
                            <span class="contact-value">carlygagephotography@gmail.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Phone</span>
                            <span class="contact-value">(214) 422-8050</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Website</span>
                            <span class="contact-value">carlygage.com</span>
                        </div>
                        <div class="contact-item">
                            <span class="contact-label">Location</span>
                            <span class="contact-value">Flower Mound, Texas</span>
                        </div>
                    </div>
                </div>

                <div class="location-note">
                    Serving DFW Families
                </div>
            </div>

            <div class="right-section">
                <div class="photo-wrapper">
                    <div class="photo-frame">
                        <img 
                            src="https://carlygage.com/images/planetblue038.jpg" 
                            alt="Carly Gage" 
                            class="photo"
                            onerror="this.style.display='none';"
                        />
                    </div>
                </div>
                
                <div class="qr-code-wrapper">
                    <div class="qr-code-label">Visit Online</div>
                    <div class="qr-code">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://carlygage.com&bgcolor=F5F2EE&color=3D4043" alt="QR Code to carlygage.com" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
